# .github/workflows/tests.yml
name: Tests

on: push

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v7
      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Tests ausführen
        run: pytest
